# 네이버 → 한진 변환 설정
# 실제 다운로드한 파일의 헤더에 맞게 이 파일만 고치면 됩니다.
# (헤더 이름은 "포함" 매칭 — '수취인연락처'는 '수취인연락처1'에도 매칭)

# 네이버 스마트스토어 주문 엑셀의 컬럼 이름
naver_cols:
  order_no:        "주문번호"
  receiver:        "수취인명"
  receiver_phone:  "수취인연락처1"
  receiver_phone2: "수취인연락처2"
  zipcode:         "우편번호"
  address:         "통합배송지"
  product_name:    "상품명"
  option:          "옵션정보"
  quantity:        "수량"
  delivery_memo:   "배송메세지"

# 한진 원클릭 대량접수 실제 양식의 컬럼(순서 = 출력 순서). ★ = 필수
hanjin_cols:
  - 받으시는 분        # ★필수
  - 받으시는 분 전화   # ★필수
  - 받는분담당자
  - 받는분핸드폰
  - 받는분우편번호     # ★필수
  - 받는분총주소       # ★필수
  - 수량
  - 품목명
  - 운임Type
  - 지불조건
  - 출고번호
  - 특기사항
  - 메모1
  - 메모2
  - 메모3
  - 메모4

# 매핑 규칙
#   from:  <naver_cols 키>   → 해당 값 그대로
#   const: <문자열>          → 고정값
#   fn:    phone|phone2|zip|item_name → 계산
# (매핑 없는 열은 빈칸)
mapping:
  받으시는 분:      { from: receiver }
  받으시는 분 전화: { fn: phone }
  받는분핸드폰:     { fn: phone }
  받는분우편번호:   { fn: zip }
  받는분총주소:     { from: address }
  수량:             { from: quantity }
  품목명:           { fn: item_name }
  운임Type:         { const: "신용" }   # 신용/선불/착불
  출고번호:         { from: order_no }
  특기사항:         { from: delivery_memo }

# 같은 수취인+주소+연락처를 한 송장으로 합치고 품목/수량 합산
combine_by_receiver: true
